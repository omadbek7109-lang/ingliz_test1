<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ingliz tili - Yakuniy testlar 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }
        .correct-flash {
            background-color: #22c55e !important;
            transition: 0.1s;
        }
        .wrong-flash {
            background-color: #ef4444 !important;
            transition: 0.1s;
        }
        .option-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .option-btn:active {
            transform: scale(0.98);
        }
        .tab-active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .tab-inactive {
            background-color: #e2e8f0;
            color: #1e293b;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2e1065 100%);
        }
    </style>
</head>
<body class="min-h-screen py-4 px-3">

    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="text-xl md:text-2xl font-bold text-white">📘 Ingliz tili</h1>
            <p class="text-indigo-200 text-sm">Yakuniy nazorat testlari 2025</p>
            <p class="text-indigo-300 text-xs mt-1">Articles · Comparatives · Past Simple · Present Simple</p>
        </div>

        <!-- Bo'lim Tabs -->
        <div class="flex flex-wrap gap-2 mb-4 justify-center">
            <button data-section="0" class="section-tab px-4 py-2 rounded-xl font-semibold transition-all tab-active">1-bo‘lim (Articles)</button>
            <button data-section="1" class="section-tab px-4 py-2 rounded-xl font-semibold transition-all tab-inactive">2-bo‘lim (Comparatives)</button>
            <button data-section="2" class="section-tab px-4 py-2 rounded-xl font-semibold transition-all tab-inactive">3-bo‘lim (Past Simple)</button>
            <button data-section="3" class="section-tab px-4 py-2 rounded-xl font-semibold transition-all tab-inactive">4-bo‘lim (Present Simple)</button>
            <button data-section="4" class="section-tab px-4 py-2 rounded-xl font-semibold transition-all tab-inactive">5-bo‘lim (Mixed)</button>
        </div>

        <!-- Test Card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-5 py-4 text-white">
                <div class="flex justify-between items-center">
                    <span class="font-semibold">📋 <span id="section-name">1-bo‘lim</span> — <span id="current-num">1</span> / <span id="total-num">0</span></span>
                    <span id="score-badge" class="bg-white/20 px-3 py-1 rounded-full text-sm">⭐ 0 to'g'ri</span>
                </div>
                <div class="w-full bg-white/30 rounded-full h-2 mt-3">
                    <div id="progress-bar" class="bg-yellow-300 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div id="question-area" class="p-5 md:p-6 min-h-[340px]">
                <!-- Dynamic -->
            </div>

            <div id="feedback" class="px-5 pb-2 text-center text-sm font-medium hidden"></div>

            <div class="px-5 pb-5 flex gap-3">
                <button id="restart-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded-xl transition">🔄 Bo‘limni qayta boshlash</button>
            </div>
        </div>

        <!-- Result Modal -->
        <div id="result-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
            <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
                <div class="text-5xl mb-2">📊</div>
                <h2 class="text-2xl font-bold text-gray-800">Test yakunlandi!</h2>
                <p class="text-gray-500 mt-1">Bo‘lim yakuni</p>
                <div class="text-5xl font-bold text-blue-600 my-2"><span id="final-score">0</span> / <span id="final-total">0</span></div>
                <div class="w-full bg-gray-200 rounded-full h-3 mb-3">
                    <div id="final-bar" class="bg-blue-600 h-3 rounded-full" style="width: 0%"></div>
                </div>
                <p id="congrats" class="text-sm text-gray-500 mb-4"></p>
                <button id="modal-restart" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-xl transition w-full">🔄 Bo‘limni qayta</button>
            </div>
        </div>
    </div>

        const allSections = [section0, section1, section2, section3, section4];
        const sectionNames = ["1-bo‘lim (Articles a/an/the)", "2-bo‘lim (Comparatives)", "3-bo‘lim (Past Simple)", "4-bo‘lim (Present Simple)", "5-bo‘lim (Mixed)"];

        let currentSection = 0;
        let shuffledQuestions = [];
        let userAnswers = [];
        let currentIndex = 0;
        let isLocked = false;
        let totalQuestions = 0;

        // DOM elements
        const questionArea = document.getElementById('question-area');
        const currentNumSpan = document.getElementById('current-num');
        const totalNumSpan = document.getElementById('total-num');
        const scoreBadge = document.getElementById('score-badge');
        const progressBar = document.getElementById('progress-bar');
        const restartBtn = document.getElementById('restart-btn');
        const feedbackDiv = document.getElementById('feedback');
        const resultModal = document.getElementById('result-modal');
        const finalScoreSpan = document.getElementById('final-score');
        const finalTotalSpan = document.getElementById('final-total');
        const finalBar = document.getElementById('final-bar');
        const congratsSpan = document.getElementById('congrats');
        const modalRestart = document.getElementById('modal-restart');
        const sectionNameSpan = document.getElementById('section-name');

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function shuffleOptions(question) {
            return shuffleArray([...question.options]);
        }

        function loadSection(sectionIdx) {
            currentSection = sectionIdx;
            const sectionData = allSections[currentSection];
            shuffledQuestions = shuffleArray([...sectionData]);
            totalQuestions = shuffledQuestions.length;
            userAnswers = new Array(totalQuestions).fill(null);
            currentIndex = 0;
            isLocked = false;
            feedbackDiv.classList.add('hidden');
            sectionNameSpan.innerText = sectionNames[currentSection];
            renderQuestion();
            updateStats();
        }

        function updateStats() {
            const correctCount = userAnswers.reduce((acc, ans, idx) => {
                if (ans === null) return acc;
                return acc + (ans === shuffledQuestions[idx].correct ? 1 : 0);
            }, 0);
            scoreBadge.innerHTML = `⭐ ${correctCount} to'g'ri`;
            const answered = userAnswers.filter(a => a !== null).length;
            const percent = (answered / totalQuestions) * 100;
            progressBar.style.width = `${percent}%`;
        }

        function renderQuestion() {
            if (currentIndex >= totalQuestions) {
                showResults();
                return;
            }
            const q = shuffledQuestions[currentIndex];
            const shuffledOpts = shuffleOptions(q);
            
            let html = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm text-blue-500 font-semibold bg-blue-100 px-3 py-1 rounded-full">Savol ${currentIndex+1}/${totalQuestions}</span>
                    </div>
                    <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-5 leading-relaxed">${escapeHtml(q.text)}</h2>
                    <div class="space-y-3">
            `;
            
            const letters = ['A', 'B', 'C', 'D'];
            shuffledOpts.forEach((opt, idx) => {
                const isSelected = (userAnswers[currentIndex] === opt);
                html += `
                    <button class="option-btn w-full text-left p-3 rounded-xl border-2 ${isSelected ? 'bg-blue-100 border-blue-500' : 'bg-gray-50 border-gray-200 hover:border-blue-300'} flex items-start gap-3" data-value="${escapeHtml(opt)}">
                        <span class="font-bold text-blue-600 min-w-[30px]">${letters[idx]}.</span>
                        <span class="flex-1">${escapeHtml(opt)}</span>
                    </button>
                `;
            });
            
            html += `</div></div>`;
            questionArea.innerHTML = html;
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (isLocked) return;
                    const selected = btn.getAttribute('data-value');
                    handleAnswer(selected, btn);
                });
            });
            
            totalNumSpan.innerText = totalQuestions;
            currentNumSpan.innerText = currentIndex + 1;
        }
        
        function handleAnswer(selected, btnElement) {
            const currentQ = shuffledQuestions[currentIndex];
            const isCorrect = (selected === currentQ.correct);
            
            userAnswers[currentIndex] = selected;
            updateStats();
            
            isLocked = true;
            
            if (isCorrect) {
                btnElement.classList.add('correct-flash');
                showFeedback("✅ To‘g‘ri javob!", "text-green-600");
                setTimeout(() => {
                    btnElement.classList.remove('correct-flash');
                    moveToNext();
                }, 800);
            } else {
                btnElement.classList.add('wrong-flash');
                showFeedback(`❌ Noto‘g‘ri! To‘g‘ri javob: ${currentQ.correct}`, "text-red-600");
                setTimeout(() => {
                    btnElement.classList.remove('wrong-flash');
                    moveToNext();
                }, 3000);
            }
        }
        
        function moveToNext() {
            if (currentIndex + 1 < totalQuestions) {
                currentIndex++;
                renderQuestion();
                isLocked = false;
                feedbackDiv.classList.add('hidden');
            } else if (currentIndex + 1 === totalQuestions) {
                currentIndex++;
                isLocked = false;
                feedbackDiv.classList.add('hidden');
                showResults();
            } else {
                isLocked = false;
            }
        }
        
        function showFeedback(msg, colorClass) {
            feedbackDiv.innerHTML = `<span class="${colorClass} font-medium">${msg}</span>`;
            feedbackDiv.classList.remove('hidden');
        }
        
        function showResults() {
            const correctCount = userAnswers.reduce((acc, ans, idx) => {
                if (ans === null) return acc;
                return acc + (ans === shuffledQuestions[idx].correct ? 1 : 0);
            }, 0);
            const percent = Math.round((correctCount / totalQuestions) * 100);
            finalScoreSpan.innerText = correctCount;
            finalTotalSpan.innerText = totalQuestions;
            finalBar.style.width = `${percent}%`;
            
            if (percent >= 80) congratsSpan.innerHTML = "🎉 Ajoyib! Ingliz tilingiz zo'r!";
            else if (percent >= 60) congratsSpan.innerHTML = "👍 Yaxshi! Yana bir marta takrorlang.";
            else congratsSpan.innerHTML = "📚 Qayta o‘rganib, testni takrorlang.";
            
            resultModal.classList.remove('hidden');
        }
        
        function restartCurrentSection() {
            resultModal.classList.add('hidden');
            loadSection(currentSection);
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Tab switching
        document.querySelectorAll('.section-tab').forEach((tab, idx) => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.section-tab').forEach(t => {
                    t.classList.remove('tab-active');
                    t.classList.add('tab-inactive');
                });
                tab.classList.remove('tab-inactive');
                tab.classList.add('tab-active');
                loadSection(idx);
            });
        });
        
        restartBtn.addEventListener('click', restartCurrentSection);
        modalRestart.addEventListener('click', () => {
            resultModal.classList.add('hidden');
            loadSection(currentSection);
        });
        
        // Start with first section
        loadSection(0);
    </script>
</body>
</html>
